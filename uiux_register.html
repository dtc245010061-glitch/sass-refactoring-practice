<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Tài Khoản - Thiết Kế Chuẩn UI/UX</title>
    <!-- Bootstrap 5 CDN & Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        body {
            background-color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
        }

        .auth-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 480px;
            padding: 40px 35px;
        }

        .form-control {
            height: 48px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            padding-left: 14px;
            font-size: 15px;
            transition: all 0.2s;
        }

        .form-control:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
        }

        /* Áp dụng Fitts' Law: Nút bấm kích thước lớn, dễ click */
        .btn-submit {
            height: 52px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            background-color: #2563eb;
            border: none;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-submit:hover {
            background-color: #1d4ed8;
        }

        .btn-submit:active {
            transform: scale(0.99);
        }

        .social-btn {
            height: 44px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            background: #ffffff;
            color: #334155;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background 0.2s;
        }

        .social-btn:hover {
            background: #f8fafc;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <!-- Logo / Icon nhận diện -->
        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-circle mb-3" style="width: 55px; height: 55px; font-size: 22px;">
                <i class="fas fa-user-plus"></i>
            </div>
            <h2 class="h4 fw-bold text-dark mb-1">Tạo Tài Khoản Mới</h2>
            <p class="text-muted small">Điền thông tin bên dưới để bắt đầu trải nghiệm</p>
        </div>

        <!-- Form đăng ký -->
        <form action="uiux_success.html" method="GET">
            <!-- 1. Họ và tên -->
            <div class="mb-3">
                <label for="name" class="form-label small fw-semibold text-secondary">Họ và tên <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="name" required placeholder="Nguyễn Văn A">
            </div>

            <!-- 2. Email -->
            <div class="mb-3">
                <label for="email" class="form-label small fw-semibold text-secondary">Địa chỉ Email <span class="text-danger">*</span></label>
                <input type="email" class="form-control" id="email" required placeholder="example@gmail.com">
            </div>

            <!-- 3. Mật khẩu -->
            <div class="mb-3">
                <label for="password" class="form-label small fw-semibold text-secondary">Mật khẩu <span class="text-danger">*</span></label>
                <input type="password" class="form-control" id="password" required placeholder="Tối thiểu 8 ký tự">
            </div>

            <!-- 4. Xác nhận mật khẩu -->
            <div class="mb-4">
                <label for="confirm_password" class="form-label small fw-semibold text-secondary">Xác nhận mật khẩu <span class="text-danger">*</span></label>
                <input type="password" class="form-control" id="confirm_password" required placeholder="Nhập lại mật khẩu trên">
            </div>

            <!-- Checkbox đồng ý điều khoản -->
            <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="termsCheck" required>
                <label class="form-check-label small text-muted" for="termsCheck">
                    Tôi đồng ý với <a href="#" class="text-decoration-none">Điều khoản dịch vụ</a> và <a href="#" class="text-decoration-none">Chính sách bảo mật</a>.
                </label>
            </div>

            <!-- Nút bấm Đăng Ký (Tuân thủ Fitts' Law) -->
            <div class="d-grid mb-3">
                <button type="submit" class="btn btn-primary btn-submit">Đăng Ký Tài Khoản</button>
            </div>
        </form>

        <div class="text-center my-3 text-muted small position-relative">
            <span>Hoặc đăng ký nhanh bằng</span>
        </div>

        <div class="d-flex gap-2 mb-4">
            <button class="social-btn w-50"><i class="fab fa-google text-danger"></i> Google</button>
            <button class="social-btn w-50"><i class="fab fa-facebook text-primary"></i> Facebook</button>
        </div>

        <p class="text-center text-muted small mb-0">
            Đã có tài khoản? <a href="#" class="text-primary text-decoration-none fw-semibold">Đăng nhập</a>
        </p>
    </div>

</body>
</html>
