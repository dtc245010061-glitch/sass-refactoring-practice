<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Navbar Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f1f5f9;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #1e293b;
            padding: 15px 25px;
            color: white;
            position: relative;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #38bdf8;
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 20px;
        }

        .nav-links a {
            text-decoration: none;
            color: white;
            font-size: 16px;
            padding: 8px 12px;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .nav-links a:hover {
            background-color: #334155;
        }

        .menu-icon {
            display: none;
            font-size: 28px;
            cursor: pointer;
            user-select: none;
        }

        /* Responsive cho Mobile: Dưới 768px */
        @media (max-width: 768px) {
            .nav-links {
                display: none; /* Ẩn menu mặc định */
                flex-direction: column;
                position: absolute;
                top: 60px;
                left: 0;
                background-color: #1e293b;
                width: 100%;
                text-align: center;
                box-shadow: 0 4px 6px rgba(0,0,0,0.15);
                z-index: 1000;
            }

            .nav-links li {
                padding: 12px;
                border-bottom: 1px solid #334155;
            }

            .menu-icon {
                display: block; /* Hiện biểu tượng hamburger */
            }

            /* Khi click mở menu qua class .active */
            .nav-links.active {
                display: flex;
            }
        }

        .content {
            padding: 40px 20px;
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">MyWebsite</div>
        <ul class="nav-links">
            <li><a href="#">Trang chủ</a></li>
            <li><a href="#">Giới thiệu</a></li>
            <li><a href="#">Dịch vụ</a></li>
            <li><a href="#">Liên hệ</a></li>
        </ul>
        <div class="menu-icon">☰</div>
    </nav>

    <div class="content">
        <h1>Thực Hành: Thanh Điều Hướng Responsive</h1>
        <p style="margin-top: 15px; color: #555;">
            Khi mở trên Desktop: Menu hiển thị nằm ngang.<br>
            Khi co nhỏ màn hình xuống dưới 768px (hoặc mở trên Mobile): Menu ẩn đi, xuất hiện biểu tượng ☰. Nhấn vào ☰ để trượt menu xuống.
        </p>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const menuIcon = document.querySelector(".menu-icon");
            const navLinks = document.querySelector(".nav-links");
            menuIcon.addEventListener("click", function () {
                navLinks.classList.toggle("active");
            });
        });
    </script>
</body>
</html>
