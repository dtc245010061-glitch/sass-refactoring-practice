<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành: CSS grid-template-columns Property</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f1f5f9;
            padding: 30px 20px;
            color: #333;
        }

        .container {
            max-width: 750px;
            margin: 0 auto;
        }

        .demo-card {
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
            margin-bottom: 25px;
        }

        h2 {
            font-size: 17px;
            color: #1e293b;
            margin-bottom: 15px;
        }

        /* Ví dụ 1: 3 cột bằng nhau (1fr 1fr 1fr) */
        .grid-equal {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
        }

        .grid-equal div {
            background-color: lightblue;
            padding: 20px;
            text-align: center;
            font-weight: bold;
            border-radius: 4px;
        }

        /* Ví dụ 2: Kích thước khác nhau (100px 200px 1fr) */
        .grid-different {
            display: grid;
            grid-template-columns: 100px 200px 1fr;
            gap: 10px;
        }

        .grid-different div {
            background-color: lightgreen;
            padding: 20px;
            text-align: center;
            font-weight: bold;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Thực hành: Thuộc tính grid-template-columns trong CSS</h1>

    <!-- Ví dụ 1 -->
    <div class="demo-card">
        <h2>Ví dụ 1: 3 cột có kích thước bằng nhau (1fr 1fr 1fr)</h2>
        <div class="grid-equal">
            <div>Ô 1</div>
            <div>Ô 2</div>
            <div>Ô 3</div>
            <div>Ô 4</div>
            <div>Ô 5</div>
            <div>Ô 6</div>
        </div>
    </div>

    <!-- Ví dụ 2 -->
    <div class="demo-card">
        <h2>Ví dụ 2: Các cột có kích thước khác nhau (100px 200px 1fr)</h2>
        <div class="grid-different">
            <div>Cột 1 (100px)</div>
            <div>Cột 2 (200px)</div>
            <div>Cột 3 (1fr)</div>
            <div>Cột 1 (100px)</div>
            <div>Cột 2 (200px)</div>
            <div>Cột 3 (1fr)</div>
        </div>
    </div>
</div>

</body>
</html>
