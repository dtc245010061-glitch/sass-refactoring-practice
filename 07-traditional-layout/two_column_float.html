<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bố cục bằng Float</title>
    <link rel="stylesheet" href="../css/two_column_float.css">
</head>
<body>
    <div class="container">
        <div class="left-column">
            <h2>Cột bên trái</h2>
            <p>Chiếm 60% chiều rộng của trang web, chứa toàn bộ nội dung chính của bài viết.</p>
        </div>
        <div class="right-column">
            <h2>Cột bên phải</h2>
            <p>Chiếm 38% chiều rộng của trang web, chứa thanh bên (sidebar) và các thông tin phụ.</p>
        </div>
    </div>
