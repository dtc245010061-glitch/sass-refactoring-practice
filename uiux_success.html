<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Thành Công</title>
    <!-- Bootstrap 5 CDN & Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        body {
            background-color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
        }

        .success-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 460px;
            padding: 45px 35px;
            text-align: center;
        }

        .success-icon {
            width: 75px;
            height: 75px;
            background-color: #dcfce7;
            color: #16a34a;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin-bottom: 20px;
        }

        .btn-action {
            height: 50px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="success-card">
        <!-- Icon thành công thân thiện -->
        <div class="success-icon">
            <i class="fas fa-check"></i>
        </div>

        <h2 class="h4 fw-bold text-dark mb-2">Đăng Ký Thành Công!</h2>
        <p class="text-muted small mb-4">
            Chúc mừng bạn đã tạo tài khoản thành công. Chúng tôi đã gửi một email xác thực đến hòm thư của bạn. Vui lòng kiểm tra và kích hoạt tài khoản.
        </p>

        <div class="d-grid gap-2">
            <a href="uiux_register.html" class="btn btn-primary btn-action d-flex align-items-center justify-content-center">
                <i class="fas fa-sign-in-alt me-2"></i> Tiếp tục đến trang Đăng nhập
            </a>
            <a href="uiux_register.html" class="btn btn-light btn-action text-secondary d-flex align-items-center justify-content-center border">
                Quay lại trang Đăng ký
            </a>
        </div>
    </div>

</body>
</html>
