<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xây dựng Trang Chủ với Bootstrap 5</title>
    <!-- Bước 1: Cài đặt Bootstrap 5 & Font Awesome 6 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        .carousel-item img {
            height: 420px;
            object-fit: cover;
        }
    </style>
</head>
<body class="bg-light pb-5">

    <!-- Bước 2: Tạo Navbar với Font Awesome -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand font-weight-bold" href="#"><i class="fas fa-home text-primary"></i> MyWebsite</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#intro">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="#contact">Services</a></li>
                    <li class="nav-item"><a class="nav-link" href="#contact">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Bước 3: Tạo Hero Section với Carousel -->
    <div id="heroCarousel" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1200&q=80" class="d-block w-100" alt="Slide 1">
            </div>
            <div class="carousel-item">
                <img src="https://images.unsplash.com/photo-1511884642898-4c92249e20b6?auto=format&fit=crop&w=1200&q=80" class="d-block w-100" alt="Slide 2">
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#heroCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#heroCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>
    </div>

    <!-- Bước 4: Thêm Section với Flexbox căn giữa -->
    <section id="intro" class="d-flex justify-content-center align-items-center bg-white py-5 shadow-sm text-center">
        <div class="container">
            <h2 class="display-6 fw-bold text-dark">Chào mừng đến với trang web của chúng tôi!</h2>
            <p class="text-muted mt-2">Nền tảng đào tạo công nghệ và thiết kế giao diện web hiện đại</p>
        </div>
    </section>

    <!-- Bước 5: Tạo Contact Form với Bootstrap Form -->
    <section id="contact" class="container mt-5 p-4 bg-white rounded shadow-sm" style="max-width: 600px;">
        <h3 class="text-center mb-4 text-primary">Liên Hệ Với Chúng Tôi</h3>
        <form>
            <div class="mb-3">
                <label for="name" class="form-label font-weight-bold">Tên của bạn</label>
                <input type="text" class="form-control" id="name" placeholder="Nhập tên" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label font-weight-bold">Email</label>
                <input type="email" class="form-control" id="email" placeholder="Nhập email" required>
            </div>
            <button type="submit" class="btn btn-primary px-4">
                <i class="fas fa-paper-plane mr-1"></i> Gửi
            </button>
        </form>
    </section>

    <!-- Bước 1: JavaScript của Bootstrap 5 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
