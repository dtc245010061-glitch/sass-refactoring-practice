<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành: CSS grid-row-gap Property</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f1f5f9;
            padding: 30px 20px;
            color: #333;
        }

        .container {
            max-width: 750px;
            margin: 0 auto;
        }

        .demo-card {
            background: #ffffff;
            padding: 20px 25px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
            margin-bottom: 25px;
        }

        h2 {
            font-size: 17px;
            color: #1e293b;
            margin-bottom: 12px;
        }

        /* 1. length (px) */
        .grid-length {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-row-gap: 20px;
        }
        .grid-length div {
            background-color: lightblue;
            padding: 18px;
            text-align: center;
            font-weight: bold;
            border-radius: 4px;
        }

        /* 2. percentage (%) */
        .grid-percentage {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-row-gap: 5%;
            height: 250px;
        }
        .grid-percentage div {
            background-color: lightgreen;
            padding: 18px;
            text-align: center;
            font-weight: bold;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Thực hành: Thuộc tính grid-row-gap trong CSS</h1>

    <!-- 1. Length (px) -->
    <div class="demo-card">
        <h2>1. Thiết lập theo độ dài (grid-row-gap: 20px)</h2>
        <div class="grid-length">
            <div>Ô 1</div>
            <div>Ô 2</div>
            <div>Ô 3</div>
            <div>Ô 4</div>
        </div>
    </div>

    <!-- 2. Percentage (%) -->
    <div class="demo-card">
        <h2>2. Thiết lập theo phần trăm (grid-row-gap: 5% trong khung height: 250px)</h2>
        <div class="grid-percentage">
            <div>Ô 1</div>
            <div>Ô 2</div>
            <div>Ô 3</div>
            <div>Ô 4</div>
        </div>
    </div>
</div>

</body>
</html>
