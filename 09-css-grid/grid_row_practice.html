<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Row</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8fafc;
            padding: 30px 20px;
        }

        .wrapper {
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            color: #1e293b;
            margin-bottom: 20px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 100px);
            gap: 10px;
            background-color: #ffffff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
        }

        .item {
            background-color: lightblue;
            padding: 20px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            border-radius: 4px;
        }

        /* Ô 1 chiếm 2 hàng liên tiếp (từ đường kẻ hàng 1 đến đường kẻ hàng 3) */
        .item1 {
            grid-row: 1 / 3;
            background-color: #fca5a5;
            color: #991b1b;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <h1>Thực hành: CSS grid-row Property</h1>
        <p style="margin-bottom: 15px; color: #64748b;">Ô 1 sử dụng <code>grid-row: 1 / 3;</code> để chiếm trọn 2 hàng liên tiếp đầu tiên.</p>
        
        <div class="grid-container">
            <div class="item item1">Ô 1 (grid-row: 1 / 3)</div>
            <div class="item">Ô 2</div>
            <div class="item">Ô 3</div>
            <div class="item">Ô 4</div>
            <div class="item">Ô 5</div>
            <div class="item">Ô 6</div>
        </div>
    </div>
</body>
</html>
