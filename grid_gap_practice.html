<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành: CSS grid-gap Property</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8fafc;
            padding: 30px 20px;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .section-box {
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
            margin-bottom: 30px;
        }

        h2 {
            font-size: 18px;
            color: #1e293b;
            margin-bottom: 15px;
        }

        /* Ví dụ 1: grid-gap: 20px (khoảng cách hàng và cột bằng nhau) */
        .grid-example-1 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-gap: 20px;
        }

        .grid-example-1 div {
            background-color: lightblue;
            padding: 20px;
            text-align: center;
            font-weight: bold;
            border-radius: 4px;
        }

        /* Ví dụ 2: grid-gap: 30px 10px (hàng 30px, cột 10px) */
        .grid-example-2 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-gap: 30px 10px;
        }

        .grid-example-2 div {
            background-color: lightgreen;
            padding: 20px;
            text-align: center;
            font-weight: bold;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Thực hành: Thuộc tính grid-gap trong CSS</h1>
    
    <!-- Ví dụ 1 -->
    <div class="section-box">
        <h2>Ví dụ 1: Thiết lập khoảng cách hàng &amp; cột đều nhau (grid-gap: 20px)</h2>
        <div class="grid-example-1">
            <div>Ô 1</div>
            <div>Ô 2</div>
            <div>Ô 3</div>
            <div>Ô 4</div>
        </div>
    </div>

    <!-- Ví dụ 2 -->
    <div class="section-box">
        <h2>Ví dụ 2: Thiết lập khoảng cách hàng &amp; cột khác nhau (grid-gap: 30px 10px)</h2>
        <div class="grid-example-2">
            <div>Ô 1</div>
            <div>Ô 2</div>
            <div>Ô 3</div>
            <div>Ô 4</div>
            <div>Ô 5</div>
            <div>Ô 6</div>
        </div>
    </div>
</div>

</body>
</html>
