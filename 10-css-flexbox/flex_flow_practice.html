<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành: CSS flex-flow Property</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8fafc;
            padding: 30px 20px;
            color: #333;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        .section-box {
            background: #ffffff;
            padding: 20px 25px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
            margin-bottom: 25px;
        }

        h2 {
            font-size: 16px;
            color: #1e293b;
            margin-bottom: 12px;
        }

        /* 1. row nowrap (Giá trị mặc định) */
        .container-1 {
            display: flex;
            flex-flow: row nowrap;
            background-color: #f1f1f1;
            padding: 10px;
            border-radius: 6px;
        }

        .container-1 > div {
            background-color: #007bff;
            color: white;
            width: 100px;
            margin: 10px;
            text-align: center;
            line-height: 50px;
            font-weight: bold;
            border-radius: 4px;
        }

        /* 2. row-reverse nowrap */
        .container-2 {
            display: flex;
            flex-flow: row-reverse nowrap;
            background-color: #f1f1f1;
            padding: 10px;
            border-radius: 6px;
        }

        .container-2 > div {
            background-color: #28a745;
            color: white;
            width: 100px;
            margin: 10px;
            text-align: center;
            line-height: 50px;
            font-weight: bold;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Thực hành: Thuộc tính flex-flow trong CSS</h1>

    <!-- Ví dụ 1 -->
    <div class="section-box">
        <h2>1. flex-flow: row nowrap (Trái qua phải, không xuống dòng)</h2>
        <div class="container-1">
            <div>1</div>
            <div>2</div>
            <div>3</div>
        </div>
    </div>

    <!-- Ví dụ 2 -->
    <div class="section-box">
        <h2>2. flex-flow: row-reverse nowrap (Phải qua trái, không xuống dòng)</h2>
        <div class="container-2">
            <div>1</div>
            <div>2</div>
            <div>3</div>
        </div>
    </div>
</div>

</body>
</html>
